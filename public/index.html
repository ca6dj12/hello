<style>
:root{color-scheme:dark;--white:#f7f5f3;--soft:rgba(247,245,243,.7);--border:rgba(255,255,255,.16);--red:#a92b33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #eee;outline-offset:3px}
.app{position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#000}
.screen{position:absolute;inset:0;display:none;min-height:0}
.screen.active{display:flex;flex-direction:column;animation:enter .25s ease both}
@keyframes enter{from{opacity:.25}to{opacity:1}}
.cover{background:#000}
.cover-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
.cover-controls{position:relative;z-index:1;margin-top:auto;padding:20px 22px calc(env(safe-area-inset-bottom,0px) + 23px);background:linear-gradient(0deg,rgba(0,0,0,.96) 25%,rgba(0,0,0,.7) 66%,transparent 100%);text-align:center}
.cover-kicker{font-family:Georgia,serif;font-size:12px;letter-spacing:.24em;margin:0 0 6px;color:#e9e9e9}
.cover-copy{font-size:13px;color:#dedede;line-height:1.5;margin:0 0 18px}
.cta{width:100%;min-height:55px;display:flex;align-items:center;justify-content:center;gap:9px;background:#f2f0ed;color:#111;border:1px solid #f2f0ed;border-radius:13px;font-weight:800;letter-spacing:.05em;font-size:15px}
.cta:disabled{background:#6c6c6c;border-color:#6c6c6c;color:#e1e1e1;cursor:not-allowed}
.cta:not(:disabled):active{transform:scale(.99)}
.mood{background:#000!important;background-image:none!important}
.header{padding:calc(env(safe-area-inset-top,0px) + 13px) 20px 0;flex:0 0 auto}
.header-row{display:grid;grid-template-columns:minmax(67px,1fr) auto minmax(45px,1fr);align-items:center;gap:6px}
.nav-back{justify-self:start;background:rgba(0,0,0,.4);color:#f0f0f0;border:1px solid var(--border);border-radius:24px;min-height:37px;padding:0 11px;font-size:11px;font-weight:700;letter-spacing:.02em;backdrop-filter:blur(8px)}
.wordmark{display:flex;align-items:center;justify-content:center;min-width:0;flex:1;text-align:center;line-height:1}.wordmark-img{display:block;width:min(56vw,250px);height:auto;max-height:28px;object-fit:contain;filter:drop-shadow(0 0 0 rgba(0,0,0,0))}
.counter{justify-self:end;font-size:12px;font-weight:700;color:#e9e9e9;letter-spacing:.01em;white-space:nowrap}
.track{height:3px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:18px}
.track-fill{height:100%;width:0;background:#e7e7e7;border-radius:9px;transition:width .2s}
.question-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:26px 20px 22px;display:flex;flex-direction:column;justify-content:center;gap:21px}
.question-scroll::-webkit-scrollbar{display:none}
.question-heading{margin:0;font-size:12px;letter-spacing:.21em;color:#d6d6d6;font-weight:700}
.question-text{font-size:clamp(21px,5.5vw,26px);line-height:1.4;letter-spacing:-.035em;font-weight:800;margin:10px 0 0;word-break:keep-all;text-wrap:pretty;text-shadow:0 2px 12px rgba(0,0,0,.65)}
.choices{display:grid;gap:10px}
.choice{border:1px solid rgba(255,255,255,.21);background:rgba(8,8,8,.73);border-radius:13px;min-height:59px;width:100%;padding:10px;text-align:left;display:flex;gap:8px;align-items:center;overflow:hidden;color:#f5f5f5;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:background .15s,border-color .15s}
.choice .letter{display:grid;place-items:center;width:26px;height:26px;flex:0 0 26px;border:1px solid rgba(255,255,255,.34);border-radius:50%;font-family:Georgia,serif;font-size:12px;font-weight:700}
.choice .choice-text{display:block;flex:0 0 auto;width:max-content;max-width:none;font-size:13px;line-height:1.35;font-weight:600;letter-spacing:-.035em;white-space:nowrap;word-break:normal;transform-origin:left center}
.choice[aria-pressed="true"]{background:rgba(242,242,242,.93);border-color:#fff;color:#131313}
.choice[aria-pressed="true"] .letter{border-color:#555}
.footer{padding:9px 20px calc(env(safe-area-inset-bottom,0px) + 18px);flex:0 0 auto;background:linear-gradient(0deg,rgba(0,0,0,.89),rgba(0,0,0,0))}
.footer .cta{min-height:52px}
.footer-tip{text-align:center;color:rgba(255,255,255,.7);font-size:11px;margin:4px 0 0}.quiz-footer{padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 15px)}
.results-scroll{flex:1;overflow-y:auto;min-height:0;padding:25px 20px 24px;scrollbar-width:none}
.results-scroll::-webkit-scrollbar{display:none}
.result-kicker{font-family:Georgia,serif;font-size:12px;letter-spacing:.22em;color:#e2e2e2;margin:0 0 13px}
.result-title{font-size:clamp(28px,8.2vw,40px);line-height:1.24;font-weight:850;letter-spacing:-.04em;margin:0 0 18px;word-break:keep-all}
.result-desc{color:var(--soft);font-size:13px;line-height:1.65;margin:0 0 18px}
.result-card{padding:18px 16px;background:rgba(7,7,7,.76);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.radar-card{margin-bottom:14px}
.radar-title,.meter-title{font-size:12px;letter-spacing:.16em;color:#e0e0e0;font-weight:800;margin:0 0 12px}
.radar-wrap{display:flex;align-items:center;justify-content:center;padding:4px 0 2px}
#radarSvg{width:min(100%,320px);height:auto;display:block}
.meter-card{margin-top:0}
.meter-row+.meter-row{margin-top:13px}
.meter-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
.meter-name{font-size:15px;font-weight:800;letter-spacing:-.02em}
.meter-en{font-size:11px;color:rgba(255,255,255,.56);font-weight:700;letter-spacing:.08em}
.hepta-meter{display:flex;gap:6px;flex-wrap:nowrap}
.hepta{width:15px;height:15px;clip-path:polygon(50% 0%,89% 18%,100% 61%,72% 95%,28% 95%,0% 61%,11% 18%);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.hepta.filled{background:#f2f0ed;border-color:#f2f0ed;box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 0 10px rgba(255,255,255,.12)}
.result-footnote{color:rgba(255,255,255,.65);font-size:11px;line-height:1.6;margin:15px 0 0}
.legend-soft{font-size:11px;color:rgba(255,255,255,.52);margin-top:8px;display:flex;justify-content:space-between;gap:10px}
@media(max-height:730px){.question-scroll{justify-content:flex-start;padding-top:22px;gap:15px}.choice{min-height:53px;padding:9px}.choices{gap:8px}.question-text{font-size:22px}.footer-tip{margin-top:4px}.cover-controls{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}}
@media(max-height:610px){.header{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}.track{margin-top:10px}.question-scroll{padding-top:13px}.footer{padding-top:4px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}}
@media(prefers-reduced-motion:reduce){.screen.active{animation:none}.track-fill,.choice{transition:none}}

/* Screens added after the quiz result */
.desire-screen{justify-content:space-between;align-items:stretch;text-align:center}
.desire-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 26px;gap:19px}
.desire-kicker{font-family:Georgia,serif;letter-spacing:.22em;font-size:12px;color:rgba(255,255,255,.68);margin:0}
.desire-heading{font-size:clamp(28px,8.6vw,40px);line-height:1.36;letter-spacing:-.06em;font-weight:850;word-break:keep-all;margin:0;text-shadow:0 4px 24px rgba(0,0,0,.66)}
.desire-line{height:1px;width:58px;background:rgba(255,255,255,.55);margin:8px 0}
.desire-description{font-size:14px;line-height:1.7;color:rgba(255,255,255,.76);margin:0}
.desire-footer{padding:16px 22px calc(env(safe-area-inset-bottom,0px) + 23px)}
.signature-screen{background:#000;justify-content:space-between}
.signature-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 22px 30px;gap:14px}
.signature-scroll::-webkit-scrollbar{display:none}
.signature-kicker{font-family:Georgia,serif;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.7);text-align:center;margin:0}
.signature-card{background:#fff;color:#080808;width:min(100%,330px);border-radius:3px;padding:14px 14px 24px;display:flex;flex-direction:column;align-items:center;box-shadow:0 22px 65px rgba(0,0,0,.42)}
.signature-art{width:min(100%,210px);height:auto;max-height:min(62dvh,470px);object-fit:contain;display:block}
.signature-korean{font-family:Georgia,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(26px,7vw,32px);font-weight:800;letter-spacing:-.065em;margin:0;padding-top:8px;white-space:nowrap}
.signature-footer{padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 18px)}
.signature-footnote{font-size:11px;color:rgba(255,255,255,.67);text-align:center;margin:0 0 10px}
@media(max-height:700px){.signature-scroll{justify-content:flex-start;padding-top:13px;gap:10px}.signature-art{width:min(100%,170px)}.signature-card{padding:9px 10px 14px}.signature-korean{font-size:25px}.signature-footer{padding-top:5px}}

/* The reveal and signature pages use black negative space; the original white artwork is inverted to white-on-black. */
.desire-screen,.signature-screen{background-color:#000;background-image:none}
.signature-card{background:transparent;color:#f7f5f3;border:0;box-shadow:none;padding:14px 14px 24px}
.signature-art{filter:invert(1);mix-blend-mode:screen;background:#000}
.signature-korean{color:#f7f5f3}
/* Opening: the last white ink drop stretches, breaks free and pulls a liquid curtain over the page. */
.cover-controls{transition:opacity .4s cubic-bezier(.2,.8,.2,1)}
.cover.is-transitioning .cover-controls{opacity:0;pointer-events:none}
.ink-wipe{position:absolute;inset:-12% 0 -3%;z-index:21;background:#050505;border-radius:48% 48% 0 0 / 9% 9% 0 0;transform:translate3d(0,110%,0);opacity:1;pointer-events:none;will-change:transform,opacity}
.ink-drop-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:22;pointer-events:none;opacity:0;will-change:opacity}
@media(prefers-reduced-motion:reduce){.cover-controls{transition:none}.ink-wipe,.ink-drop-canvas{will-change:auto}}

/* Plain black pages; original opening artwork alone remains untouched. */
#quiz,#results,#desire,#signature{background:#000!important;background-image:none!important}
.cover-controls{background:transparent!important;padding:8px 22px calc(env(safe-area-inset-bottom,0px) + 23px)!important}
.cover #start{background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;color:#fff!important;min-height:48px;font-size:17px;font-weight:700;letter-spacing:.055em;text-shadow:0 1px 8px rgba(0,0,0,.65)}
.cover #start:disabled{background:transparent!important;border:0!important;color:#fff!important}

/* Final page: one enlarged illustration only; white source artwork inverted on pure black. */
#signature.signature-art-only{background:#000!important;background-image:none!important;display:none;position:absolute;inset:0;overflow:hidden}
#signature.signature-art-only.active{display:flex;align-items:center;justify-content:center}
#signature .signature-art-center{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 44px) 12px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:hidden}
#signature .signature-art{display:block;width:auto!important;height:auto!important;max-width:min(94vw,400px)!important;max-height:80dvh!important;object-fit:contain;background:#000!important;filter:invert(1)!important;mix-blend-mode:screen!important}
#signature .signature-back-only{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;width:36px;height:36px;border:0;background:transparent;color:#eee;font-size:26px;line-height:1;padding:0}

/* The droplet overlay is scaled with the original drink illustration, never separately. */
#signature .signature-ink-stage{position:relative;flex:none;width:min(94vw,400px,43.65dvh);aspect-ratio:299/548;overflow:visible;background:#000}
#signature .signature-ink-stage .signature-art{display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:fill!important;filter:invert(1)!important;mix-blend-mode:screen!important;background:#000!important}
#signature .signature-liquid-overlay{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;display:block}
@media(max-height:700px){#signature .signature-ink-stage{width:min(90vw,400px,41dvh)}}

/* The former desire-page message now sits ABOVE the drink illustration. */
#signature .signature-art-center{flex-direction:column;justify-content:center;gap:clamp(10px,2.4dvh,22px);padding:calc(env(safe-area-inset-top,0px) + 55px) 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
#signature .signature-intro{flex:none;text-align:center;color:#fff;max-width:100%;padding:0 5px}
#signature .signature-intro h1{font-size:clamp(26px,7.2vw,34px);font-weight:850;line-height:1.33;letter-spacing:-.055em;margin:0;word-break:keep-all}
#signature .signature-intro p{font-size:clamp(11px,3.15vw,14px);color:rgba(255,255,255,.72);margin:clamp(9px,2.3dvh,19px) 0 0;line-height:1.5;word-break:keep-all}
#signature .signature-ink-stage{width:min(88vw,365px,31.5dvh);flex:0 0 auto}
@media(max-height:700px){#signature .signature-art-center{padding-top:calc(env(safe-area-inset-top,0px) + 44px);gap:8px}#signature .signature-intro h1{font-size:clamp(22px,6.8vw,30px)}#signature .signature-intro p{margin-top:7px}#signature .signature-ink-stage{width:min(87vw,340px,30dvh)}}

#signature .signature-liquid-overlay{display:none !important}
#signature .signature-drop-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;opacity:1}
#signature .signature-art-center{justify-content:flex-start !important;gap:clamp(10px,2.2dvh,20px) !important;padding:calc(env(safe-area-inset-top,0px) + 36px) 10px calc(env(safe-area-inset-bottom,0px) + 10px) !important}
#signature .signature-intro h1{line-height:1.28 !important}
#signature .signature-intro p{margin:clamp(8px,1.9dvh,16px) 0 0 !important;line-height:1.45 !important}
#signature .signature-ink-stage{width:min(94vw,420px,46dvh) !important;flex:0 0 auto !important}
@media(max-height:700px){#signature .signature-art-center{padding-top:calc(env(safe-area-inset-top,0px) + 32px) !important;gap:8px !important}#signature .signature-ink-stage{width:min(92vw,390px,41dvh) !important}}


#signature .signature-art{opacity:0 !important;pointer-events:none !important}
#signature .signature-drop-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;display:block}


/* Reveal the matching drink name only after the drop lands. */
#signature .signature-name-reveal{flex:0 0 auto;width:100%;max-width:420px;min-height:78px;margin-top:clamp(4px,1.5dvh,14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#fff;opacity:0;transform:translateY(12px);transition:opacity .58s ease,transform .7s cubic-bezier(.2,.75,.2,1);pointer-events:none}
#signature .signature-name-reveal.visible{opacity:1;transform:translateY(0)}
#signature .signature-name-en{font-family:Georgia,'Times New Roman',serif;font-size:clamp(24px,7vw,31px);line-height:1;font-weight:700;letter-spacing:.01em;margin:0}
#signature .signature-name-ko{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:clamp(23px,6.5vw,30px);line-height:1.2;font-weight:850;letter-spacing:-.045em;margin:0}
@media(max-height:700px){#signature .signature-name-reveal{gap:8px;min-height:66px;margin-top:2px}#signature .signature-name-en{font-size:24px}#signature .signature-name-ko{font-size:23px}}
@media(prefers-reduced-motion:reduce){#signature .signature-name-reveal{transition:none;transform:none}}

/* Final name reveal: center of the entire final screen, in front of the illustration. */
#signature .signature-name-reveal{
  position:absolute!important;inset:0!important;z-index:8!important;
  box-sizing:border-box;width:100%!important;max-width:none!important;
  height:100%!important;min-height:0!important;margin:0!important;
  padding:24px!important;display:flex!important;
  flex-direction:column;align-items:center;justify-content:center;
  gap:18px!important;text-align:center;background:rgba(0,0,0,.92);
  opacity:0;visibility:hidden;transform:scale(.94)!important;
  transition:opacity .32s ease,transform .38s cubic-bezier(.19,1,.22,1),visibility 0s linear .38s!important;
  pointer-events:none;
}
#signature .signature-name-reveal.visible{
  opacity:1;visibility:visible;transform:scale(1)!important;
  transition:opacity .32s ease,transform .38s cubic-bezier(.19,1,.22,1),visibility 0s!important;
}
#signature .signature-name-en{font-size:clamp(34px,10vw,49px)!important;line-height:1.1!important}
#signature .signature-name-ko{font-size:clamp(30px,9vw,44px)!important;line-height:1.25!important}
#signature .signature-back-only{z-index:10!important}
@media(max-height:700px){#signature .signature-name-reveal{gap:14px!important}}
@media(prefers-reduced-motion:reduce){#signature .signature-name-reveal{transition:none!important}}

#quiz{isolation:isolate}

/* ===== LUXURY QUESTION TRANSITION ===== */
#quiz{overflow:hidden}
#quizTransition{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;overflow:hidden;isolation:isolate}
#quizTransition .qt-curtain{position:absolute;inset:-8%;background:
  radial-gradient(120% 70% at 50% 44%,rgba(38,38,38,.24),rgba(0,0,0,.96) 58%,#000 82%),
  linear-gradient(180deg,#080808 0%,#010101 100%);
  transform:translate3d(0,108%,0);will-change:transform;box-shadow:0 -18px 60px rgba(0,0,0,.72)}
#quizTransition .qt-glint{position:absolute;left:-20%;right:-20%;top:50%;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.08) 20%,rgba(185,38,45,.88) 50%,rgba(255,255,255,.1) 78%,transparent 100%);
  box-shadow:0 0 16px rgba(169,43,51,.45),0 0 2px rgba(255,255,255,.3);
  opacity:0;transform:translate3d(-22%,0,0) scaleX(.72);will-change:transform,opacity}
#quizTransition .qt-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,transparent 0 30%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.6) 100%);opacity:0}
#quizTransition.play{opacity:1}
#quizTransition.play .qt-curtain{animation:qtCurtain 760ms cubic-bezier(.72,0,.18,1) both}
#quizTransition.play .qt-glint{animation:qtGlint 760ms cubic-bezier(.22,.8,.2,1) both}
#quizTransition.play .qt-vignette{animation:qtVignette 760ms ease both}
@keyframes qtCurtain{
  0%{transform:translate3d(0,108%,0)}
  42%{transform:translate3d(0,0,0)}
  58%{transform:translate3d(0,0,0)}
  100%{transform:translate3d(0,-108%,0)}
}
@keyframes qtGlint{
  0%,24%{opacity:0;transform:translate3d(-28%,32vh,0) scaleX(.7)}
  40%{opacity:.92;transform:translate3d(0,0,0) scaleX(1)}
  56%{opacity:.55;transform:translate3d(10%,-2vh,0) scaleX(.9)}
  76%,100%{opacity:0;transform:translate3d(34%,-34vh,0) scaleX(.65)}
}
@keyframes qtVignette{0%,100%{opacity:0}42%,58%{opacity:1}}

/* outgoing question: restrained camera pull-back */
#questionScroll.question-exit>div:first-child{animation:qOutTitle 300ms cubic-bezier(.4,0,.8,.2) both}
#questionScroll.question-exit #choices{animation:qOutChoices 280ms cubic-bezier(.4,0,.8,.2) both}
@keyframes qOutTitle{to{opacity:0;transform:translate3d(0,-10px,0) scale(.985);filter:blur(5px)}}
@keyframes qOutChoices{to{opacity:0;transform:translate3d(0,13px,0) scale(.985);filter:blur(4px)}}

/* incoming question: editorial stagger */
#questionScroll.question-enter .question-heading{animation:qIn 520ms 80ms cubic-bezier(.19,1,.22,1) both}
#questionScroll.question-enter .question-text{animation:qIn 600ms 125ms cubic-bezier(.19,1,.22,1) both}
#questionScroll.question-enter .choice{opacity:0;transform:translate3d(0,16px,0) scale(.985);filter:blur(5px);animation:qChoiceIn 560ms cubic-bezier(.19,1,.22,1) forwards}
#questionScroll.question-enter .choice:nth-child(1){animation-delay:190ms}
#questionScroll.question-enter .choice:nth-child(2){animation-delay:235ms}
#questionScroll.question-enter .choice:nth-child(3){animation-delay:280ms}
#questionScroll.question-enter .choice:nth-child(4){animation-delay:325ms}
@keyframes qIn{from{opacity:0;transform:translate3d(0,14px,0);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes qChoiceIn{to{opacity:1;transform:none;filter:blur(0)}}

/* subtle premium pulse on selected answer */
.choice[aria-pressed="true"]{position:relative;box-shadow:0 8px 28px rgba(255,255,255,.055),inset 0 0 0 1px rgba(255,255,255,.18)}
.choice[aria-pressed="true"]::after{content:"";position:absolute;inset:-1px;border-radius:13px;border:1px solid rgba(255,255,255,.55);opacity:0;animation:selectedHalo 520ms ease-out both;pointer-events:none}
@keyframes selectedHalo{0%{opacity:.72;transform:scale(.995)}100%{opacity:0;transform:scale(1.035)}}

@media(prefers-reduced-motion:reduce){
  #quizTransition{display:none!important}
  #questionScroll.question-exit>div:first-child,#questionScroll.question-exit #choices,
  #questionScroll.question-enter .question-heading,#questionScroll.question-enter .question-text,#questionScroll.question-enter .choice{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}
}



/* Result-specific personality copy on the final reveal. */
#signature .signature-trait{
  margin-top:clamp(8px,1.7dvh,15px);
  width:min(92vw,430px);
  display:grid;gap:7px;
  font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  text-align:left;word-break:keep-all;
}
/* Final reveal: show only the matching glass above the drink name.
   It reuses the lower portion of the original signature artwork. */
#signature .signature-glass-crop{
  --glass-w:min(78vw,354px);
  position:relative;width:var(--glass-w);height:calc(var(--glass-w) * .6949);margin:0 auto 8px;overflow:hidden;
  flex:0 0 auto;pointer-events:none;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.62));
}
#signature .signature-glass-crop img{
  position:absolute;left:50%;top:calc(var(--glass-w) * -1.0678);transform:translateX(-50%);
  width:var(--glass-w);height:auto;max-width:none!important;max-height:none!important;
  filter:invert(1)!important;mix-blend-mode:screen;background:#000;
}
#signature .trait-sex{align-items:stretch;padding-top:10px;padding-bottom:11px}
#signature .sex-reveal-wrap{min-width:0}
#signature .sex-confirm{
  margin:0 0 8px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  font-family:Georgia,'Times New Roman',serif;text-align:center;
}
#signature .sex-age-warning{
  color:#f3eeee;font-size:clamp(11px,2.9vw,13px);font-weight:800;letter-spacing:.02em;
}
#signature .fbi-warning{
  color:#d64850;font-size:clamp(10px,2.65vw,12px);font-weight:900;letter-spacing:.13em;
  border:1px solid rgba(214,72,80,.65);padding:3px 7px;border-radius:3px;
}
#signature .sex-secret{
  position:relative;min-height:64px;border-radius:10px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(163,35,44,.5);background:linear-gradient(135deg,rgba(30,7,10,.92),rgba(5,5,5,.96));
  transition:border-color .25s ease,background .25s ease,transform .18s ease;
  outline:none;
}
#signature .sex-secret:active{transform:scale(.992)}
#signature .sex-secret:focus-visible{box-shadow:0 0 0 2px rgba(214,72,80,.5)}
#signature .sex-secret .trait-copy{
  display:block;padding:13px 12px;color:rgba(255,255,255,.92);
  transition:filter .32s ease,opacity .32s ease,transform .32s ease;
}
#signature .sex-secret.is-locked .trait-copy{filter:blur(9px);opacity:.16;user-select:none;transform:scale(.985)}
#signature .sex-lock-overlay{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:radial-gradient(circle at 50% 45%,rgba(117,20,27,.26),rgba(0,0,0,.83) 68%);
  color:#f3efec;text-align:center;transition:opacity .28s ease,visibility .28s ease;
}
#signature .sex-lock-main{font-family:Georgia,'Times New Roman',serif;font-size:clamp(12px,3.1vw,14px);font-weight:800;letter-spacing:.02em}
#signature .sex-lock-sub{font-size:10px;color:rgba(255,255,255,.58);letter-spacing:.08em}
#signature .sex-secret.revealed{border-color:rgba(255,255,255,.18);background:rgba(7,7,7,.76)}
#signature .sex-secret.revealed .sex-lock-overlay{opacity:0;visibility:hidden;pointer-events:none}
#signature .sex-secret.revealed .trait-copy{filter:none!important;opacity:1!important;transform:none!important}
#signature .trait-row{
  display:grid;grid-template-columns:72px 1fr;gap:9px;align-items:start;
  padding:10px 11px;border:1px solid rgba(255,255,255,.11);border-radius:10px;
  background:linear-gradient(110deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#signature .trait-label{
  color:#c84a50;font-size:clamp(11.5px,3vw,13.5px);line-height:1.48;
  font-weight:850;letter-spacing:-.02em;white-space:nowrap;
}
#signature .trait-copy{
  color:rgba(255,255,255,.86);font-size:clamp(12px,3.15vw,15px);line-height:1.55;
  font-weight:520;letter-spacing:-.03em;
}
@media(max-height:700px){
  #signature .signature-name-en{font-size:clamp(27px,8vw,38px)!important}
  #signature .signature-name-ko{font-size:clamp(25px,7.4vw,34px)!important}
  #signature .signature-name-reveal{gap:7px!important;padding:14px 14px!important}
  #signature .signature-trait{margin-top:3px;gap:5px;width:min(94vw,420px)}
  #signature .trait-row{grid-template-columns:64px 1fr;gap:7px;padding:6px 8px}
  #signature .trait-label{font-size:11px}
  #signature .trait-copy{font-size:11.5px;line-height:1.46}
  #signature .signature-glass-crop{--glass-w:min(72vw,300px);margin-bottom:4px}
  #signature .sex-confirm{margin-bottom:6px}
  #signature .sex-secret{min-height:58px}
}



/* vNext: instant answer advance + clickable FBI reveal */
#signature .signature-name-reveal.visible{pointer-events:auto!important}
#signature .signature-trait,#signature .trait-row,#signature .sex-reveal-wrap,#signature .sex-secret{pointer-events:auto!important}
#signature .sex-confirm{display:none!important}
#signature .sex-lock-overlay{
  gap:8px!important;
  background:
    linear-gradient(110deg,transparent 0 42%,rgba(190,30,42,.11) 48%,transparent 55%),
    radial-gradient(circle at 50% 42%,rgba(145,20,30,.34),rgba(0,0,0,.92) 70%)!important;
  background-size:240% 100%,100% 100%!important;
  animation:fbiScan 2.4s linear infinite;
  cursor:pointer;
}
#signature .sex-warning-line{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
#signature .sex-age-warning{
  color:#fff!important;font-size:clamp(11.5px,3vw,14px)!important;font-weight:900!important;letter-spacing:-.01em!important;
}
#signature .fbi-warning{
  position:relative;display:inline-block;color:#ff4e59!important;font-size:clamp(11px,2.8vw,13.5px)!important;
  font-weight:950!important;letter-spacing:.14em!important;border:1px solid rgba(255,73,85,.84)!important;
  padding:4px 8px!important;border-radius:3px!important;text-shadow:0 0 12px rgba(255,50,64,.72);
  box-shadow:0 0 0 0 rgba(255,55,68,.34);animation:fbiPulse 1.12s ease-in-out infinite;
}
#signature .fbi-warning::before{
  content:'';position:absolute;inset:-2px;border:1px solid rgba(255,74,86,.35);border-radius:4px;
  animation:fbiFrame 1.12s ease-out infinite;pointer-events:none;
}
#signature .sex-lock-main{font-size:clamp(13px,3.3vw,15px)!important;font-weight:900!important}
#signature .sex-lock-sub{font-size:9.5px!important;letter-spacing:.18em!important;color:rgba(255,255,255,.48)!important}
@keyframes fbiPulse{0%,100%{opacity:.72;transform:scale(1);box-shadow:0 0 0 0 rgba(255,55,68,.20)}50%{opacity:1;transform:scale(1.045);box-shadow:0 0 18px 2px rgba(255,55,68,.24)}}
@keyframes fbiFrame{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
@keyframes fbiScan{0%{background-position:145% 0,0 0}100%{background-position:-145% 0,0 0}}
#signature .sex-secret.revealed .sex-lock-overlay{display:none!important}
#signature .sex-secret.revealed{cursor:default!important}
@media(prefers-reduced-motion:reduce){#signature .sex-lock-overlay,#signature .fbi-warning,#signature .fbi-warning::before{animation:none!important}}


/* v2 spacing refinements */
#signature .signature-name-reveal .traits-wrap,
#signature .signature-name-reveal .trait-results,
#signature .signature-name-reveal .result-traits,
#signature .signature-name-reveal .personality-results{
  margin-top:clamp(28px,4.8dvh,46px)!important;
}
#signature .signature-name-reveal .trait-item,
#signature .signature-name-reveal .trait-row{
  margin-top:clamp(14px,2.1dvh,22px)!important;
}
.sex-reveal-sub,.fbi-sub,.sexual-reveal-en{display:none!important;}


/* final spacing pass */
#signature .signature-trait{
  margin-top:clamp(30px,5.2dvh,50px)!important;
}
#signature .signature-trait .trait-row{
  margin-top:0!important;
}
@media(max-height:700px){
  #signature .signature-trait{margin-top:clamp(18px,3.4dvh,28px)!important;}
}

</style>

":"끝나고 같이 밥 먹을 기회를 만든다.","points":"식3 · 색2 · 나1"}]},{"q":"하루 동안 투명인간이 된다면?","a":[{"text":"궁금했던 사람을 몰래 지켜본다.","points":"색3 · 질2 · 분1"},{"text":"성공한 사람들의 사는 방식을 구경한다.","points":"탐3 · 질2 · 나1"},{"text":"날 무시했던 사람에게 장난친다.","points":"분3 · 교2 · 질1"},{"text":"하루 종일 아무 눈치 안 보고 논다.","points":"나3 · 탐2 · 식1"}]},{"q":"상사에게 “보고 싶어 자기야❤️”를 잘못 보냈다.","a":[{"text":"농담으로 자연스럽게 넘긴다.","points":"교3 · 색2 · 나1"},{"text":"답장이 올 때까지 계속 신경 쓴다.","points":"분3 · 교2 · 색1"},{"text":"오히려 친해질 기회로 만든다.","points":"탐3 · 교2 · 색1"},{"text":"너무 민망해서 그냥 집에 가고 싶다.","points":"나3 · 분2 · 식1"}]},{"q":"비밀 하나 말하면 위스키 한 잔이 무료다.","a":[{"text":"가벼운 연애 비밀 하나 말한다.","points":"색3 · 식2 · 탐1"},{"text":"한 잔 말고 더 줄 수 있냐고 묻는다.","points":"탐3 · 식2 · 질1"},{"text":"가장 재밌는 비밀을 골라 말한다.","points":"교3 · 질2 · 탐1"},{"text":"분위기 좋으면 몇 잔 더 마신다.","points":"식3 · 나2 · 색1"}]},{"q":"연인과 여행을 갔는데 나만 비즈니스석으로 무료 업그레이드됐다.","a":[{"text":"미안하지만 이런 기회는 즐기고 본다.","points":"식3 · 교2 · 탐1"},{"text":"연인에게 양보할지 잠깐 고민한다.","points":"교3 · 탐2 · 식1"},{"text":"같이 못 타는 게 아쉽지만 혜택은 다 누린다.","points":"질3 · 분2 · 식1"},{"text":"연인에게 자랑하며 비즈니스석으로 간다.","points":"나3 · 탐2 · 식1"}]},{"q":"내 흑역사가 밈으로 전국적으로 유행한다.","a":[{"text":"돈 될 방법부터 생각한다.","points":"탐3 · 분2 · 질1"},{"text":"누가 처음 퍼뜨렸는지 찾아본다.","points":"분3 · 교2 · 식1"},{"text":"이왕이면 더 크게 유행했으면 한다.","points":"분3 · 질2 · 교1"},{"text":"한동안 SNS를 끄고 잠수한다.","points":"나3 · 분2 · 질1"}]},{"q":"회식에서 마지막 남은 고급 안주 한 점이 눈앞에 있다.","a":[{"text":"눈치 보고 바로 먹는다.","points":"색3 · 분2 · 질1"},{"text":"누가 먹나 끝까지 지켜본다.","points":"나3 · 분2 · 색1"},{"text":"자연스럽게 내 앞으로 가져온다.","points":"질3 · 색2 · 교1"},{"text":"귀찮아서 그냥 술이나 마신다.","points":"식3 · 나2 · 색1"}]}];
const SINS=[{k:'교',name:'교만',en:'PRIDE'},{k:'질',name:'질투',en:'ENVY'},{k:'분',name:'분노',en:'WRATH'},{k:'나',name:'나태',en:'SLOTH'},{k:'탐',name:'탐욕',en:'GREED'},{k:'식',name:'탐식',en:'GLUTTONY'},{k:'색',name:'색욕',en:'LUST'}];
let index=0;

function hideReaction(){}
function showReactionAt(){}
const $=id=>document.getElementById(id);

function show(name){screens.forEach(id=>$(id).classList.toggle('active',id===name));}
function cancelAdvance(){clearTimeout(advanceTimer);advanceTimer=null;advancing=false;hideReaction();
  const qt=$('quizTransition');if(qt)qt.classList.remove('play');

function animateQuestionIn(){

  qs.classList.add('question-enter');

function transitionToQuestion(nextIndex){
  if(nextIndex<0||nextIndex>=QUESTIONS.length)return;
  const qs=$('questionScroll'),qt=$('quizTransition');
  const HOLD_DELAY=350; // 이전 버전과 현재 버전의 중간 체감 딜레이
  setTimeout(()=>{
    qs.classList.remove('question-enter');qs.classList.add('question-exit');
    qt.classList.remove('play');void qt.offsetWidth;qt.classList.add('play');
    setTimeout(()=>{
      index=nextIndex;renderQuestion();
      qs.classList.remove('question-exit');
      animateQuestionIn();
    },220);
    setTimeout(()=>{qt.classList.remove('play');},560);
  },HOLD_DELAY);

function renderQuestion(){
  hideReaction();
  const q=QUESTIONS[index];
  $('counter').textContent=String(index+1).padStart(2,'0')+' / '+QUESTIONS.length;
  $('progress').setAttribute('aria-valuenow',String(index+1));
  $('progressFill').style.width=((index+1)/QUESTIONS.length*100)+'%';
  $('questionNumber').textContent='QUESTION '+String(index+1).padStart(2,'0');
  $('questionText').textContent=q.q;
  $('choices').replaceChildren();
  q.a.forEach((option,j)=>{
    const btn=document.createElement('button');btn.type='button';btn.className='choice';
    btn.setAttribute('aria-pressed',String(answers[index]===j));
    const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[j];
    const text=document.createElement('span');text.className='choice-text';text.textContent=option.text;
    btn.append(letter,text);
    btn.addEventListener('click',(event)=>{
      if(advancing)return;
      answers[index]=j;renderChoicesOnly();
      advancing=true;
      hideReaction();
      advanceTimer=null;

function renderChoicesOnly(){

}
function fitChoiceTexts(){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  Array.from($('choices').children).forEach(btn=>{
    const text=btn.querySelector('.choice-text');
    text.style.fontSize='13px';text.style.transform='none';
    const styles=getComputedStyle(btn);
    const available=btn.clientWidth-parseFloat(styles.paddingLeft)-parseFloat(styles.paddingRight)-btn.querySelector('.letter').offsetWidth-parseFloat(styles.columnGap||styles.gap||0)-2;
    let font=13;
    const family=getComputedStyle(text).fontFamily;
    const weight=getComputedStyle(text).fontWeight;
    const spacing=parseFloat(getComputedStyle(text).letterSpacing)||0;
    function textWidth(){ctx.font=weight+' '+font+'px '+family;return ctx.measureText(text.textContent).width+Math.max(0,text.textContent.length-1)*spacing;}
    while(font>11.5 && textWidth()>available){font-=.25;}
    text.style.fontSize=font+'px';
    const width=Math.max(text.scrollWidth,textWidth());
    if(width>available)text.style.transform='scaleX('+Math.max(.68,Math.min(1,available/width))+')';
  });
}
window.addEventListener('resize',()=>{if($('quiz').classList.contains('active'))fitChoiceTexts();});
function calculate(){
  const points=Object.fromEntries(SINS.map(s=>[s.k,0]));
  QUESTIONS.forEach((q,i)=>{
    const option=q.a[answers[i]];
    option.points.split(' · ').forEach(s=>{points[s[0]]+=Number(s.slice(-1));});
  });
  return SINS.map(s=>({...s,points:points[s.k]})).sort((a,b)=>b.points-a.points);
}
function heptaLevel(points){
  const baseLevel=Math.max(0,Math.min(7,Math.round(points/42*7)));
  return Math.min(7,baseLevel*2);
}
function polarPoint(cx,cy,r,angle){
  return [cx + Math.cos(angle)*r, cy + Math.sin(angle)*r];
}
function buildPolygonPoints(values,maxRadius,cx,cy){
  return values.map((v,i)=>{
    const angle=-Math.PI/2 + i*(Math.PI*2/values.length);
    const [x,y]=polarPoint(cx,cy,maxRadius*v,angle);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}
function renderRadar(stats){
  const svg=$('radarSvg');
  svg.replaceChildren();
  const ns='http://www.w3.org/2000/svg';
  const cx=160, cy=156, radius=96, levels=5;
  const exaggeration=2;
  const scaledRatio=points=>Math.min(1,(points/42)*exaggeration);
  for(let l=1;l<=levels;l++){
    const ratio=l/levels;
    const pts=buildPolygonPoints(new Array(7).fill(ratio),radius,cx,cy);
    const poly=document.createElementNS(ns,'polygon');
    poly.setAttribute('points',pts);
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke',l===levels?'rgba(255,255,255,.28)':'rgba(255,255,255,.12)');
    poly.setAttribute('stroke-width','1');
    svg.append(poly);
  }
  stats.forEach((s,i)=>{
    const angle=-Math.PI/2 + i*(Math.PI*2/stats.length);
    const [x,y]=polarPoint(cx,cy,radius,angle);
    const axis=document.createElementNS(ns,'line');
    axis.setAttribute('x1',cx);axis.setAttribute('y1',cy);axis.setAttribute('x2',x);axis.setAttribute('y2',y);
    axis.setAttribute('stroke','rgba(255,255,255,.15)');
    axis.setAttribute('stroke-width','1');
    svg.append(axis);
  });
  const dataPts=buildPolygonPoints(stats.map(s=>scaledRatio(s.points)),radius,cx,cy);
  const fillPoly=document.createElementNS(ns,'polygon');
  fillPoly.setAttribute('points',dataPts);
  fillPoly.setAttribute('fill','rgba(242,240,237,.18)');
  fillPoly.setAttribute('stroke','#f2f0ed');
  fillPoly.setAttribute('stroke-width','2');
  svg.append(fillPoly);
  stats.forEach((s,i)=>{
    const angle=-Math.PI/2 + i*(Math.PI*2/stats.length);
    const [mx,my]=polarPoint(cx,cy,radius*scaledRatio(s.points),angle);
    const dot=document.createElementNS(ns,'circle');
    dot.setAttribute('cx',mx);dot.setAttribute('cy',my);dot.setAttribute('r','3.5');
    dot.setAttribute('fill','#f2f0ed');
    svg.append(dot);
    const [lx,ly]=polarPoint(cx,cy,radius+26,angle);
    const txt=document.createElementNS(ns,'text');
    txt.setAttribute('x',lx);txt.setAttribute('y',ly);
    txt.setAttribute('fill','#f2f0ed');
    txt.setAttribute('font-size','12');
    txt.setAttribute('font-weight','800');
    txt.setAttribute('text-anchor',Math.abs(lx-cx)<8?'middle':(lx<cx?'end':'start'));
    txt.setAttribute('dominant-baseline',Math.abs(ly-cy)<10?(ly<cy?'auto':'hanging'):'middle');
    txt.textContent=s.name;
    svg.append(txt);
  });
}
function renderResults(){
  if(answers.some(answer=>answer===null))return;
  const ranked=calculate();
  const high=ranked[0].points;
  const leaders=ranked.filter(s=>s.points===high);
  $('resultTitle').textContent=leaders.map(s=>s.name).join(' · ');
  const ordered=SINS.map(base=>ranked.find(item=>item.k===base.k));
  $('scoreCard').replaceChildren();
  ordered.forEach(s=>{
    const row=document.createElement('div');row.className='meter-row';
    const head=document.createElement('div');head.className='meter-head';
    const nameWrap=document.createElement('div');
    const name=document.createElement('div');name.className='meter-name';name.textContent=s.name;
    const en=document.createElement('div');en.className='meter-en';en.textContent=s.en;
    nameWrap.append(name,en);
    const meter=document.createElement('div');meter.className='hepta-meter';
    const filled=heptaLevel(s.points);
    for(let i=0;i<7;i++){
      const cell=document.createElement('span');
      cell.className='hepta'+(i<filled?' filled':'');
      meter.append(cell);
    }
    head.append(nameWrap,meter);
    row.append(head);
    $('scoreCard').append(row);
  });
  renderRadar(ordered);
  show('results');$('resultsScroll').scrollTop=0;
}

  for(let yy=0;yy<probe.height;yy++){

    for(let xx=0;xx<90;xx++){

const RESULT_TRAITS={"교":{"love":"좋아해도 쉽게 매달리진 않는다. 서로 존중하면서 나를 특별하게 봐주는 관계를 좋아한다.","sex":"침대에서도 주도권을 잡는 걸 좋아하고, 상대가 내 매력에 반응하는 모습을 볼 때 만족감이 크다.","work":"인정받을수록 몰입도가 올라간다. 맡았다면 남들보다 잘해내고 싶어 한다."},"질":{"love":"좋아하는 사람의 말투나 시선 변화를 잘 알아챈다. 관심이 다른 곳으로 가면 은근히 신경 쓰인다.","sex":"상대가 나에게만 집중하고 있다는 확신이 중요하다. 관심이 분산되면 질투와 소유욕이 올라오는 편이다.","work":"경쟁자가 생기면 집중력이 올라간다. 비교가 스트레스이면서도 성장의 자극이 된다."},"분":{"love":"서운한 걸 오래 숨기기보다 바로 말하는 편이다. 감정 표현이 솔직해서 관계도 빠르게 뜨거워진다.","sex":"잔잔한 분위기보다 감정과 텐션이 높은 관계에 끌린다. 서로 강하게 반응할수록 몰입도가 높아진다.","work":"답답하거나 부당한 상황을 그냥 넘기지 않는다. 필요할 때 가장 먼저 행동하는 타입이다."},"나":{"love":"복잡한 밀당보다 같이 있어 편한 관계를 좋아한다. 노력하지 않아도 자연스러운 사람에게 끌린다.","sex":"복잡하게 분위기를 만들기보다 편하게 붙어 있다가 자연스럽게 스킨십이 이어지는 걸 좋아한다.","work":"무조건 열심히보다 효율적으로 하려 한다. 힘을 덜 쓰고 결과를 내는 방법을 잘 찾는다."},"탐":{"love":"마음에 드는 사람이 생기면 애매하게 두기보다 관계를 분명하게 만들고 싶어 한다.","sex":"한 번 마음에 들면 조금으로 끝내기 아쉬워한다. 스킨십도 관계도 충분히 만족할 때까지 즐기고 싶어 한다.","work":"목표가 생기면 욕심이 확실하다. 좋은 기회가 보이면 빠르게 잡는 편이다."},"식":{"love":"데이트도 하나의 즐거움이라 생각한다. 맛집, 술, 여행처럼 함께 누리는 경험을 중요하게 여긴다.","sex":"향, 술, 음악, 피부의 감촉 같은 감각적인 요소에 약하다. 분위기가 맞으면 오래 즐기고 싶어 한다.","work":"재미를 느끼는 일에는 깊게 빠져든다. 반대로 흥미가 없으면 집중력이 빠르게 떨어질 수 있다."},"색":{"love":"설렘과 끌림이 중요하다. 마음에 드는 사람이 생기면 관심이 자연스럽게 행동으로 드러난다.","sex":"서로의 끌림과 스킨십이 빠르게 이어지는 타입이다. 마음에 들면 욕구를 비교적 솔직하게 표현한다.","work":"사람과 분위기를 읽는 감각이 좋다. 흥미가 생긴 일에는 추진력이 빠르게 올라간다."},"교질":{"love":"사랑에서도 인정받고 싶은 마음이 강하다. 상대가 다른 사람을 더 신경 쓰면 은근히 승부욕이 생긴다.","sex":"상대가 나에게 완전히 빠져 있다는 느낌을 좋아한다. 관심을 확인할수록 주도권도 더 잡고 싶어진다.","work":"경쟁 상황에서 강해진다. 남에게 밀린다는 느낌이 오히려 실력을 끌어올리는 자극이 된다."},"교분":{"love":"무시당한다는 느낌을 특히 싫어한다. 존중이 깨지면 감정을 바로 표현하는 편이다.","sex":"부드럽고 잔잔하기보다 텐션이 높고 강하게 몰입되는 분위기를 좋아한다. 주도권 경쟁도 자극이 될 수 있다.","work":"자존심을 건드리는 상황에서 오히려 집중력이 올라간다. 한번 맡은 일은 쉽게 물러서지 않는다."},"교나":{"love":"좋아해도 굳이 애써 쫓아가진 않는다. 자연스럽게 나를 좋아해주는 사람에게 더 마음이 간다.","sex":"편하게 시작하지만 분위기가 타면 자연스럽게 주도권을 가져가는 편이다. 상대가 따라오는 걸 즐긴다.","work":"힘은 아끼면서도 결과는 좋게 내고 싶어 한다. 효율과 완성도를 동시에 챙기는 타입이다."},"교탐":{"love":"마음에 드는 사람에게 선택받고 싶다는 욕심이 있다. 관계에서도 기준이 높은 편이다.","sex":"상대의 반응도 충분히 보고 싶고 만족감도 크게 느끼고 싶어 한다. 관계에서도 대충보다 확실 async function getSignatureImage(sin){
  if(SIGNATURE_IMAGE_CACHE[sin]) return SIGNATURE_IMAGE_CACHE[sin];
  const img=await loadImage(SIGNATURE_DRINKS[sin].image);
  SIGNATURE_IMAGE_CACHE[sin]=img;
  return img;
}
async function getSignatureRows(sin){
  if(SIGNATURE_ROW_CACHE[sin]) return SIGNATURE_ROW_CACHE[sin];
  const config=SIGNATURE_DROPS[sin];
  const img=await loadImage(config.drop);
  const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
  const cx=c.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0);
  const data=cx.getImageData(0,0,c.width,c.height).data;
  const rows=[]; let minX=999,maxX=-999;
  for(let y=0;y<c.height;y++){
    let first=-1,last=-1;
    for(let x=0;x<c.width;x++){
      const k=(y*c.width+x)*4;
      if(data[k+3]>18 && data[k]>80){ if(first<0) first=x; last=x; }
    }
    if(first>=0){
      const row={y:config.start+y,l:120+first,r:120+last,w:last-first+1};
      rows.push(row); if(row.l<minX) minX=row.l; if(row.r>maxX) maxX=row.r;
    }
  }
  let cutoff=rows[0]?.y||config.start;
  let narrow=Infinity;
  const upperLimit=config.start + Math.round((config.end-config.start)*0.45);
  rows.forEach(r=>{ if(r.y<=upperLimit && r.w<narrow){ narrow=r.w; cutoff=r.y; } });
  const meta={rows,minX,maxX,cutoff};
  SIGNATURE_ROW_CACHE[sin]=meta;
  return meta;
}
async function animateSignatureDrop(sin){
  stopSignatureDrop();
  const token=signaturePlayToken;
  const stage=$('signatureInkStage');
  const canvas=$('signatureDropCanvas');
  const [baseImg,meta] = await Promise.all([getSignatureImage(sin), getSignatureRows(sin)]);
  if(token!==signaturePlayToken) return;
  const impact=SIGNATURE_IMPACT[sin]||{};
  const config=SIGNATURE_DROPS[sin];
  const rect=stage.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,4);
  canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr);
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  const w=rect.width, h=rect.height;
  const sx=w/299, sy=h/548; const toX=x=>x*sx, toY=y=>y*sy;
  const rows=meta.rows, cutoff=meta.cutoff;
  const start=config.start, end=config.end, surface=impact.surface||config.surface;
  const stemBase=Math.min(cutoff-6, start+16);
  const bulbTop=Math.min(end-8, cutoff + Math.max(18, Math.round((end-start)*0.38)));
  const duration=1740, begin=performance.now();
  const clamp=v=>Math.max(0,Math.min(1,v));
  const ease=t=>{t=clamp(t); return t*t*(3-2*t);};
  const easeOut=t=>1-Math.pow(1-clamp(t),3);

  function traceRows(rowsPart,{translate=0,pinch=0,upper=false,lower=false,retract=0,mapY=(y=>y)}={}){
    if(rowsPart.length<2) return false;
    const left=[], right=[];
    for(const row of rowsPart){
      let mapped=mapY(row.y);
      if(upper && row.y>stemBase){ mapped=mapY(stemBase)+(mapped-mapY(stemBase))*(1-.965*retract); }
      const y=toY(mapped)+translate;
      const mid=(row.l+row.r)/2;
      const neck=row.y>stemBase && row.y<bulbTop;
      let width=neck ? 1-.14*pinch : 1;
      if(pinch>0){ const distance=(row.y-cutoff)/9; width*=1-.99*pinch*Math.exp(-distance*distance); }
      if(upper) width*=ease((cutoff-row.y)/18);
      if(lower) width*=ease((row.y-cutoff)/18);
      width=Math.max(.003,width);
      left.push([toX(mid+(row.l-mid)*width), y]);
      right.push([toX(mid+(row.r-mid)*width), y]);
    }
    if(left.length<2) return false;
    ctx.beginPath();
    ctx.moveTo(...left[0]);
    for(let i=1;i<left.length;i++) ctx.lineTo(...left[i]);
    for(let i=right.length-1;i>=0;i--) ctx.lineTo(...right[i]);
    ctx.closePath();
    return true;
  }
  function eraseOriginalDrop(){
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    if(traceRows(rows)) ctx.fill();
    ctx.restore();
  }
  // All seven drinks use the same physical timing: the lower tip reaches the
  // actual liquor surface, becomes submerged there, and never renders below it.
  // Reverted back to a near-immediate break: barely any stretching, then a clean fall.
  const breakMs=240, impactMs=1080;
  const stretchDistance=0;
  function drawSplash(ms){
    if(ms<impactMs-20) return;
    const t=easeOut((ms-(impactMs-20))/270);
    const alpha=(1-ease((ms-(impactMs+205))/175))*ease((ms-(impactMs-20))/65);
    if(alpha<=0) return;
    const cx=toX(150), cy=toY(surface)+.7*sy;
    const rippleMax=(impact.rippleMax||13)*sx;
    const crownW=(impact.crownWidth||6.5)*sx;
    const crownH=(impact.crownHeight||4.8)*sy;
    const beadSpread=(impact.beadSpread||6)*sx;
    const beadLift=(impact.beadLift||8)*sy;
    ctx.save();ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineWidth=1.15;ctx.globalAlpha=alpha;
    // Small ripples and three fine droplets, appearing only at contact.
    ctx.beginPath();
    ctx.ellipse(cx,cy,1.4*sx+rippleMax*t,.45*sy+1.6*sy*t,0,0,Math.PI*2);
    ctx.stroke();
    const rise=(1-t)*crownH;
    ctx.beginPath();ctx.moveTo(cx-crownW,cy);
    ctx.quadraticCurveTo(cx-crownW*.45,cy-rise*.55,cx-crownW*.12,cy-rise);
    ctx.quadraticCurveTo(cx,cy-rise*1.07,cx+crownW*.12,cy-rise);
    ctx.quadraticCurveTo(cx+crownW*.45,cy-rise*.55,cx+crownW,cy);
    ctx.stroke();
    ctx.globalAlpha=alpha*(1-t*.8);
    const beadY=cy-Math.sin(Math.PI*t)*beadLift;
    const spread=beadSpread*(.52+.48*t);
    const r=Math.max(.65,1.4-.75*t)*sx;
    ctx.beginPath();ctx.arc(cx-spread,beadY,r,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+spread,beadY,r,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx,beadY-.5*beadLift,r*.72,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function drawBaseWhite(){
    ctx.save();
    ctx.filter='grayscale(1) invert(1) contrast(1.25) brightness(1.08)';
    ctx.drawImage(baseImg,0,0,w,h);
    ctx.restore();
  }
  function drawLiquid(ms){
    ctx.clearRect(0,0,w,h);
    drawBaseWhite();
    eraseOriginalDrop();
    // Gently stretch the source droplet without sending it through the glass.
    const stretch=stretchDistance*ease(ms/breakMs);
    const mapY=y=>y<=stemBase?y:y<bulbTop?
      stemBase+(y-stemBase)*(1+stretch/(bulbTop-stemBase)):y+stretch;
    ctx.fillStyle='#fff';
    if(ms<breakMs){
      const pinch=ease((ms-(breakMs-120))/120);
      if(traceRows(rows,{pinch,mapY}))ctx.fill();
    }else{
      const upper=rows.filter(row=>row.y<=cutoff);
      const lower=rows.filter(row=>row.y>=cutoff);
      const retract=ease((ms-breakMs)/170);
      if(traceRows(upper,{upper:true,retract,mapY}))ctx.fill();
      if(ms<impactMs){
        // Gravity accelerates the isolated droplet; its tip stops at the liquor.
        const flight=clamp((ms-breakMs)/(impactMs-breakMs));
        const fall=flight*flight;
        const finalTravel=Math.max(0,surface-(end+stretchDistance));
        const translate=toY(finalTravel*fall);
        const tip=end+stretch+finalTravel*fall;
        // A short fade is the drop being absorbed into the surface, not a cut.
        const absorption=ease((tip-(surface-11))/11);
        ctx.save();
        ctx.globalAlpha=1-absorption;
        ctx.beginPath();ctx.rect(0,0,w,toY(surface)+.5*sy);ctx.clip();
        if(traceRows(lower,{lower:true,translate,mapY}))ctx.fill();
        ctx.restore();
      }
    }
    drawSplash(ms);
  }
  function tick(now){
    if(token!==signaturePlayToken) return;
    const ms=Math.min(duration, now-begin);
    drawLiquid(ms);
    // The matching English/Korean name appears once the splash has settled.
    if(ms>=impactMs+290) $('signatureNameReveal').classList.add('visible');
    if(ms<duration) signatureAnimationFrame=requestAnimationFrame(tick);
    else { ctx.clearRect(0,0,w,h); drawBaseWhite(); eraseOriginalDrop(); signatureAnimationFrame=0; }
  }
  signatureAnimationFrame=requestAnimationFrame(tick);
}
function renderSignature(){
  const ranked=calculate();
  const winning=ranked[0];
  const drink=SIGNATURE_DRINKS[winning.k];
  $('signatureArt').src=drink.image;
  $('signatureArt').alt=drink.en+' 상징과 술잔';
  $('signatureGlass').src=drink.image;
  $('signatureNameReveal').classList.remove('visible');
  $('signatureNameEn').textContent=drink.en;
  $('signatureNameKo').textContent=drink.kr;
  renderSignatureTrait(ranked);
  show('signature');
  requestAnimationFrame(()=>animateSignatureDrop(winning.k));
}
$('toDesire').addEventListener('click',renderSignature);
$('signatureBack').addEventListener('click',()=>{stopSignatureDrop();show('results');});
const restartBtn=$('restart');
if(restartBtn)restartBtn.addEventListener('click',()=>{stopSignatureDrop();cancelAdvance();index=0;answers=Array(QUESTIONS.length).fill(null);show('cover');});
renderQuestion();
</script>
