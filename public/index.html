<link rel="stylesheet" href="./styles.css">

<body>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="matte" aria-hidden="true"></div>

<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="ink" x="-25%" y="-25%" width="150%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkSoft" x="-25%" y="-25%" width="150%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<header class="topbar">
  <button class="mark" type="button" data-act="home">DEADLYSINS</button>
  <button id="lang" class="lang" type="button" aria-label="Switch language">EN</button>
</header>

<main id="app" class="app" aria-live="polite"></main>

<script src="./data.js"></script>
<script src="./scoring.js"></script>
<script src="./app.js"></script>
</body>
