<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>메뉴 관리 · DEADLY SINS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
<!-- 사장님 전용: 품절 · 가격 · 숨김 · NEW · 새 메뉴. 저장은 /api/menu (비밀번호 = Vercel 환경 변수 ADMIN_PASSWORD) -->
<main id="app">
  <header class="top">
    <h1>메뉴 관리</h1>
    <p class="brand">DEADLY SINS</p>
  </header>

  <form id="login" class="login" autocomplete="on">
    <label for="pw">관리자 비밀번호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">들어가기</button>
    <p id="loginMsg" class="msg" role="alert"></p>
  </form>

  <div id="editor" hidden>
    <p class="help">
      바꾼 뒤 아래 <b>저장하기</b>를 누르면 손님 화면에 10초쯤 뒤 반영돼요.
      <b>품절</b>은 메뉴에 '품절'로 보이고, <b>숨김</b>은 메뉴에서 빠지고, <b>NEW</b>는 이름 옆에 표시돼요.
    </p>
    <div id="sections"></div>
    <div class="foot">
      <p id="lastSaved" class="dim"></p>
      <a class="link" href="./#menu" target="_blank" rel="noopener">손님 메뉴판 보기 ↗</a>
      <button type="button" id="undo" class="ghost">직전 저장으로 되돌리기</button>
      <button type="button" id="logout" class="ghost">나가기</button>
    </div>
  </div>
</main>

<div id="bar" class="bar" hidden>
  <p id="barMsg" class="bar-msg" role="status"></p>
  <button type="button" id="save" class="primary" disabled>저장하기</button>
</div>

<script src="data.js"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
